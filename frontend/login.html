<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — DecisionDeck</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-link">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="14" cy="22" r="3.5" fill="#3B82F6" />
          <path d="M14 18.5V13C14 11 11 9 7 9" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
          <circle cx="7" cy="9" r="2.5" fill="#8B5CF6"/>
          <path d="M14 18.5V6" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="14" cy="5" r="3" fill="#22C55E"/>
          <path d="M14 18.5V13C14 11 17 9 21 9" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
          <circle cx="21" cy="9" r="2.5" fill="#8B5CF6"/>
        </svg>
        <span>DecisionDeck</span>
      </a>
      <a href="/register.html" class="nav-link">Don't have an account? Sign up</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="card auth-card">
      <div class="card-header">
        <h1 class="card-title" style="font-size: 1.5rem;">Welcome back</h1>
        <p class="card-subtitle">Log in to view and manage your decisions.</p>
      </div>

      <div id="loginAlert" class="alert alert-danger" style="display: none;" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          <div id="emailError" class="form-error">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <div id="passwordError" class="form-error">Password is required.</div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
          <span>Log In</span>
        </button>
      </form>

      <div style="margin-top: var(--space-lg); text-align: center; font-size: 0.875rem;">
        <span style="color: var(--text-secondary);">New to DecisionDeck?</span>
        <a href="/register.html" style="margin-left: 0.25rem;">Create an account</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>&copy; DecisionDeck. Make choices with clarity.</span>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
